name: Format surface PR 262

on:
  push:
    branches:
      - fix/surface-lod-and-traversal-20261023

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/surface-lod-and-traversal-20261023
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install black==24.1.0 ruff==0.5.7
      - name: Apply formatting and safe lint fixes
        run: |
          files=(
            game/entities/store.py
            game/entities/registry.py
            game/world/registry_actor_store.py
            game/world/lod_hydration.py
            game/world/surface_population.py
            game/world/surface_materializer.py
            game/world/surface_context.py
            game/world/save_diff_journal.py
            game/world/surface_identity.py
            tests/test_surface_production_regressions.py
            tests/test_surface_lifecycle_integration.py
            tests/test_surface_population.py
            tests/test_save_diff_journal.py
          )
          python -m black "${files[@]}"
          python -m ruff check --fix "${files[@]}"
          python -m black "${files[@]}"
      - name: Commit formatting to this PR branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add game/entities game/world tests/test_surface_production_regressions.py tests/test_surface_lifecycle_integration.py tests/test_surface_population.py tests/test_save_diff_journal.py
            git commit -m "Format PR262 surface changes with Black and Ruff"
            git push origin HEAD:fix/surface-lod-and-traversal-20261023
          fi
