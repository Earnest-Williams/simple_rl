name: Surface production regressions

on:
  pull_request:
    paths:
      - 'game/entities/**'
      - 'game/world/**'
      - 'worldgen/overland/**'
      - 'tests/test_surface_*.py'
      - 'tests/test_lod_hydration.py'
      - 'pyproject.toml'
      - '.github/workflows/surface-regressions.yml'
  workflow_dispatch:

jobs:
  surface-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install headless Qt shared libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and test requirements
        run: python -m pip install -e '.[dev]'
      - name: Run surface integration regressions
        run: >
          python -m pytest -q
          tests/test_surface_production_regressions.py
          tests/test_surface_lifecycle_integration.py
          tests/test_surface_performance_contracts.py
          tests/test_surface_ledger_log.py
          tests/test_lod_hydration.py
          tests/test_surface_context.py
          tests/test_surface_materializer.py
          tests/test_save_diff_journal.py
          tests/test_surface_population.py
      - name: Run remaining test suite (known broken window test excluded)
        if: always()
        run: python -m pytest -q --ignore=tests/engine/test_window_manager_height_toggle.py
      - name: Check Black formatting of new modules and formatted surface files
        if: always()
        run: >
          python -m black --check
          game/world/registry_actor_store.py game/world/lod_hydration.py
          game/world/surface_population.py game/world/surface_context.py
          game/world/save_diff_journal.py game/world/surface_identity.py
          tests/test_surface_production_regressions.py
          tests/test_surface_lifecycle_integration.py
          tests/test_surface_performance_contracts.py
          tests/test_surface_ledger_log.py
      - name: Check Black on modified legacy lines only
        if: always()
        run: >
          python scripts/check_black_changed_lines.py
          game/entities/store.py game/entities/registry.py
          game/world/surface_materializer.py
      - name: Ruff lint changed surface files
        if: always()
        run: >
          python -m ruff check
          game/entities/store.py game/entities/registry.py
          game/world/registry_actor_store.py game/world/lod_hydration.py
          game/world/surface_population.py game/world/surface_materializer.py
          game/world/surface_context.py game/world/save_diff_journal.py
          game/world/surface_identity.py
          tests/test_surface_production_regressions.py
          tests/test_surface_lifecycle_integration.py
          tests/test_surface_performance_contracts.py
          tests/test_surface_ledger_log.py
      - name: Strict mypy gate for modified surface modules
        if: always()
        run: >
          python -m mypy --strict --follow-imports=silent
          game/entities/registry.py
          game/world/lod_hydration.py
          game/world/registry_actor_store.py
          game/world/save_diff_journal.py
          game/world/surface_context.py
          game/world/surface_identity.py
          game/world/surface_materializer.py
          game/world/surface_population.py
      - name: Type-check repository (legacy baseline reported separately)
        if: always()
        continue-on-error: true
        run: python -m mypy .
