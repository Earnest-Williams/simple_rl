name: Format new ledger and serializer files

on:
  push:
    branches:
      - fix/surface-lod-and-traversal-20261023

permissions:
  contents: write

jobs:
  black-new-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/surface-lod-and-traversal-20261023
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project Black
        run: python -m pip install black==24.1.0
      - name: Format only new identity and serialization code
        run: |
          python -m black \
            game/world/surface_identity.py \
            game/world/save_diff_journal.py \
            tests/test_surface_ledger_log.py \
            tests/test_save_diff_journal.py \
            scripts/check_black_changed_lines.py
      - name: Commit formatter result to the PR branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              game/world/surface_identity.py \
              game/world/save_diff_journal.py \
              tests/test_surface_ledger_log.py \
              tests/test_save_diff_journal.py \
              scripts/check_black_changed_lines.py
            git commit -m "Format new ledger and JSON migration code"
            git push origin HEAD:fix/surface-lod-and-traversal-20261023
          fi
