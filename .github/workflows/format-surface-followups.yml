name: Format surface follow-up changes

on:
  push:
    branches:
      - fix/surface-lod-and-traversal-20261023

permissions:
  contents: write

jobs:
  format-followups:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/surface-lod-and-traversal-20261023
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact configured formatter
        run: python -m pip install black==24.1.0
      - name: Format only files changed in this follow-up
        run: |
          python -m black             game/entities/store.py             game/entities/registry.py             game/world/lod_hydration.py             game/world/registry_actor_store.py             game/world/surface_population.py             game/world/surface_identity.py             tests/test_surface_performance_contracts.py
      - name: Commit formatting to original PR branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add               game/entities/store.py               game/entities/registry.py               game/world/lod_hydration.py               game/world/registry_actor_store.py               game/world/surface_population.py               game/world/surface_identity.py               tests/test_surface_performance_contracts.py
            git commit -m "Format surface follow-up changes with Black"
            git push origin HEAD:fix/surface-lod-and-traversal-20261023
          fi
